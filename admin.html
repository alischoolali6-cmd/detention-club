<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Detention Club Admin</title>
<style>
:root{
  --paper: oklch(97% 0.015 70); --paper-2: oklch(94% 0.020 70); --ink: oklch(19% 0.020 45);
  --ink-2: oklch(34% 0.018 45); --muted: oklch(46% 0.020 60); --orange: oklch(68% 0.19 45);
  --orange-ink: oklch(97% 0.02 70); --pink: oklch(62% 0.20 358); --blue: oklch(55% 0.17 250);
  --lime: oklch(80% 0.19 132); --yellow: oklch(85% 0.16 95); --focus: oklch(60% 0.22 45);
  --shadow: 4px 4px 0 var(--ink);
  --font-display: "Bricolage Grotesque", ui-sans-serif, sans-serif;
  --font-body: "Plus Jakarta Sans", ui-sans-serif, sans-serif;
  --font-num: "Space Mono", ui-monospace, monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);line-height:1.5;padding:1rem}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.wrap{max-width:60rem;margin:0 auto}
h1,h2{font-family:var(--font-display);font-weight:800;letter-spacing:-.02em;line-height:1.05;margin:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;margin-block:1rem 2rem}
.btn{font:800 .85rem var(--font-body);border:3px solid var(--ink);border-radius:999px;padding:.7em 1.3em;background:var(--orange);color:var(--orange-ink);box-shadow:var(--shadow);cursor:pointer;text-decoration:none;white-space:nowrap}
.btn--ghost{background:var(--paper);color:var(--ink)}
.card{border:3px solid var(--ink);border-radius:22px;background:var(--paper);box-shadow:var(--shadow);padding:1.25rem}
.login{max-width:24rem;margin:4rem auto}
.login form{display:grid;gap:.9rem;margin-top:1rem}
label{font-weight:700;font-size:.85rem;display:grid;gap:.3rem}
input{font:inherit;padding:.7em 1em;border:3px solid var(--ink);border-radius:14px;background:var(--paper);color:var(--ink)}
.err{color:var(--pink);font-weight:700;min-height:1.4em;margin:0}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem;margin-bottom:1.5rem}
.stat b{display:block;font-family:var(--font-num);font-size:2.2rem;color:var(--orange);font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;font-weight:700;color:var(--ink-2)}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem}
.bars{display:grid;gap:.4rem;margin-top:.8rem}
.bar{display:grid;grid-template-columns:4.2rem 1fr 2.2rem;gap:.6rem;align-items:center;font-size:.8rem;font-weight:700}
.bar i{display:block;height:14px;border-radius:999px;background:var(--orange);border:2px solid var(--ink);min-width:4px}
.bar em{font-style:normal;font-family:var(--font-num);text-align:right}
ul{list-style:none;margin:.8rem 0 0;padding:0;display:grid;gap:.5rem;font-size:.85rem}
li{display:flex;justify-content:space-between;gap:1rem;border-bottom:1px solid var(--paper-2);padding-bottom:.4rem}
.muted{color:var(--muted)}
@media(max-width:44rem){.stats,.cols{grid-template-columns:1fr}}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Plus+Jakarta+Sans:wght@500;700;800&family=Space+Mono:wght@700&display=swap">
</head>
<body>
<div class="wrap">
  <section id="loginView" class="card login">
    <h1>Admin</h1>
    <form id="loginForm">
      <label>Username<input id="u" autocomplete="username" required></label>
      <label>Password<input id="p" type="password" autocomplete="current-password" required></label>
      <p class="err" id="err" role="alert"></p>
      <button class="btn" type="submit">Log in</button>
    </form>
  </section>

  <section id="dash" hidden>
    <div class="top">
      <h1>Detention Club dashboard</h1>
      <div style="display:flex;gap:.6rem">
        <button class="btn btn--ghost" id="refresh">Refresh</button>
        <button class="btn btn--ghost" id="logout">Log out</button>
        <a class="btn" href="./">View site</a>
      </div>
    </div>
    <div class="stats">
      <div class="card stat"><b id="sTotal">0</b><span>Total views</span></div>
      <div class="card stat"><b id="sUnique">0</b><span>Unique visitors</span></div>
      <div class="card stat"><b id="sToday">0</b><span>Views today</span></div>
    </div>
    <div class="cols">
      <div class="card"><h2>Last 14 days</h2><div class="bars" id="days"></div></div>
      <div class="card"><h2>Devices</h2><div class="bars" id="devices"></div>
        <h2 style="margin-top:1.5rem">Where they came from</h2><div class="bars" id="refs"></div></div>
    </div>
    <div class="card" style="margin-top:1rem"><h2>Latest visits</h2><ul id="recent"></ul></div>
  </section>
</div>
<script src="config.js"></script>
<script>
(function(){
  var c = window.DC_CONFIG || {};
  var $ = function(id){ return document.getElementById(id); };
  var creds = null;
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(m){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]; }); }

  async function load(u, p){
    var r = await fetch(c.supabaseUrl + "/rest/v1/rpc/get_stats", {
      method:"POST",
      headers:{ apikey:c.supabaseAnonKey, Authorization:"Bearer "+c.supabaseAnonKey, "Content-Type":"application/json" },
      body: JSON.stringify({ p_username:u, p_password:p })
    });
    if(!r.ok) throw new Error(r.status === 400 || r.status === 404 ? "Wrong username or password." : "Could not reach the server.");
    return r.json();
  }
  function bars(el, rows, label, max){
    el.innerHTML = rows.length ? rows.map(function(x){
      return '<div class="bar"><span>'+esc(label(x))+'</span><i style="width:'+Math.max(2, Math.round(x.views/max*100))+'%"></i><em>'+x.views+'</em></div>';
    }).join("") : '<p class="muted">No data yet.</p>';
  }
  function render(d){
    $("sTotal").textContent = d.total; $("sUnique").textContent = d.unique; $("sToday").textContent = d.today;
    var m = Math.max.apply(null, d.by_day.map(function(x){return x.views;}).concat(1));
    bars($("days"), d.by_day, function(x){ return x.day.slice(5); }, m);
    var dm = Math.max.apply(null, d.devices.map(function(x){return x.views;}).concat(1));
    bars($("devices"), d.devices, function(x){ return x.device; }, dm);
    var rm = Math.max.apply(null, d.referrers.map(function(x){return x.views;}).concat(1));
    bars($("refs"), d.referrers, function(x){ return x.referrer; }, rm);
    $("recent").innerHTML = d.recent.length ? d.recent.map(function(x){
      return '<li><span>'+esc(new Date(x.at).toLocaleString())+'</span><span class="muted">'+esc(x.device||"")+(x.referrer?" · "+esc(x.referrer):"")+'</span></li>';
    }).join("") : '<li class="muted">No visits yet.</li>';
  }
  async function show(u, p){
    var d = await load(u, p);
    creds = { u:u, p:p };
    $("loginView").hidden = true; $("dash").hidden = false;
    render(d);
  }
  $("loginForm").addEventListener("submit", async function(e){
    e.preventDefault(); $("err").textContent = "";
    if(!c.supabaseUrl){ $("err").textContent = "Admin isn't connected to Supabase yet."; return; }
    try{ await show($("u").value.trim(), $("p").value); }
    catch(x){ $("err").textContent = x.message; }
  });
  $("refresh").addEventListener("click", function(){ if(creds) show(creds.u, creds.p).catch(function(){}); });
  $("logout").addEventListener("click", function(){ creds = null; $("p").value = ""; $("dash").hidden = true; $("loginView").hidden = false; });
})();
</script>
</body>
</html>
